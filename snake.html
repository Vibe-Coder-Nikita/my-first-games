<canvas id="gameCanvas" width="400" height="400" style="border: 2px solid white; background: #111;"></canvas>
<h3 style="color: white; font-family: Arial;">Очки: <span id="scoreText">0</span></h3>

<script>
    let canvas = document.getElementById("gameCanvas");
    let ctx = canvas.getContext("2d");
    let scoreText = document.getElementById("scoreText");

    let x = 40; 
    let y = 40; 
    let size = 20; 
    let dx = size; 
    let dy = 0;    

    let foodX = 100;
    let foodY = 100;
    let score = 0;

    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowUp" && dy === 0) { dx = 0; dy = -size; }
        if (event.key === "ArrowDown" && dy === 0) { dx = 0; dy = size; }
        if (event.key === "ArrowLeft" && dx === 0) { dx = -size; dy = 0; }
        if (event.key === "ArrowRight" && dx === 0) { dx = size; dy = 0; }
    });

    setInterval(function() {
        x = x + dx;
        y = y + dy;

        if (x >= 400) x = 0;
        if (x < 0) x = 380;
        if (y >= 400) y = 0;
        if (y < 0) y = 380;

        // Проверка: если змейка наступила на еду
        if (x === foodX && y === foodY) {
            score = score + 1;
            scoreText.innerText = score;
            foodX = Math.floor(Math.random() * 20) * 20; 
            foodY = Math.floor(Math.random() * 20) * 20; 
        }

        // Стираем прошлый кадр
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, 400, 400);

        // Рисуем змейку (зеленую)
        ctx.fillStyle = "lime";
        ctx.fillRect(x, y, size, size);

        // Рисуем яблоко (красное)
        ctx.fillStyle = "red";
        ctx.fillRect(foodX, foodY, size, size);
        
    }, 100); 
</script>
